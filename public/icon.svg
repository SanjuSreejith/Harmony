<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Music Disc / Waves -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8" />
  
  <!-- Glowing Center Icon -->
  <g filter="url(#glow)">
    <!-- Musical Note Node 1 -->
    <ellipse cx="190" cy="320" rx="38" ry="28" transform="rotate(-15 190 320)" fill="url(#accent)" />
    <!-- Musical Note Node 2 -->
    <ellipse cx="320" cy="280" rx="38" ry="28" transform="rotate(-15 320 280)" fill="url(#neon)" />
    <!-- Stem 1 -->
    <rect x="216" y="160" width="14" height="155" rx="7" fill="url(#accent)" />
    <!-- Stem 2 -->
    <rect x="346" y="120" width="14" height="155" rx="7" fill="url(#neon)" />
    <!-- Beam -->
    <polygon points="216,160 360,120 360,148 216,188" fill="url(#neon)" />
  </g>
  
  <!-- Sound Equalizer Bars at bottom -->
  <rect x="170" y="380" width="12" height="30" rx="6" fill="#06b6d4" />
  <rect x="195" y="365" width="12" height="45" rx="6" fill="#3b82f6" />
  <rect x="220" y="350" width="12" height="60" rx="6" fill="#8b5cf6" />
  <rect x="245" y="360" width="12" height="50" rx="6" fill="#ec4899" />
  <rect x="270" y="345" width="12" height="65" rx="6" fill="#10b981" />
  <rect x="295" y="365" width="12" height="45" rx="6" fill="#06b6d4" />
  <rect x="320" y="375" width="12" height="35" rx="6" fill="#3b82f6" />
</svg>
